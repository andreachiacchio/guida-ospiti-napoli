<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guida ospiti Napoli – redirect</title>
<meta http-equiv="refresh" content="0;url=https://andreachiacchio.github.io/la-goccia-di-san-gennaro/">
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var apt = q.get("apt");
  var lang = q.get("lang");
  var target = (apt === "1")
    ? "https://andreachiacchio.github.io/napoli-sotterranea-bnb/"
    : "https://andreachiacchio.github.io/la-goccia-di-san-gennaro/";
  if (lang === "en") target += "?lang=en";
  location.replace(target);
})();
</script>
</head>
<body>
<p>Reindirizzamento… / Redirecting…
<a id="go" href="https://andreachiacchio.github.io/la-goccia-di-san-gennaro/">continua</a></p>
